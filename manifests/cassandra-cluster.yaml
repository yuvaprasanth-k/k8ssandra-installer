# ==============================================================================
# cassandra-cluster.yaml — example K8ssandraCluster for --cluster-manifest
#
# The setup script normally GENERATES this from your settings (and saves the
# result to /root/k8ssandra-<cluster>.yaml). Use this file when you want full
# control over the spec:
#
#   sudo bash scripts/k8s-k8ssandra-setup.sh --role all --config config/cluster.env \
#     --cluster-manifest manifests/cassandra-cluster.yaml
#
# Print what the script would generate:  bash scripts/k8s-k8ssandra-setup.sh --render-only
# Full spec reference: https://docs.k8ssandra.io/reference/crd/
# ==============================================================================
apiVersion: k8ssandra.io/v1alpha1
kind: K8ssandraCluster
metadata:
  name: cassandra-cluster
  namespace: k8ssandra-operator
spec:
  cassandra:
    serverVersion: "4.1.8"
    datacenters:
      - metadata:
          name: dc1
        size: 3
        # resources:              # recommended for production
        #   requests: { cpu: "2", memory: "8Gi" }
        #   limits:   { memory: "8Gi" }
        # racks:                  # one rack per AZ (nodes are auto-labelled on EC2)
        #   - name: us-east-1a
        #     nodeAffinityLabels: { topology.kubernetes.io/zone: us-east-1a }
        storageConfig:
          cassandraDataVolumeClaimSpec:
            storageClassName: local-path
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi
        config:
          jvmOptions:
            heapSize: 2048M
